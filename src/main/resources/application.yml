server:
  tomcat:
    threads:
      max: 30
    accept-count: 50
    max-connections: 8192

spring:
  application:
    name: VisitDestinationReview
  datasource:
    url: jdbc:h2:mem:single_testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    generate-ddl: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: true
  h2:
    console:
      enabled: true
      path: /h2
      settings:
        web-allow-others: true

data:
  web:
    pageable:
      default-page-size: 10
      max-page-size: 2000

logging:
  level:
    root: off
    org:
      hibernate:
        SQL: debug
        type:
          descriptor:
            sql: trace